name: ML Pipeline CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_ci.txt

      - name: Configure DagsHub credentials
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          echo "DAGSHUB_USER_TOKEN=$DAGSHUB_TOKEN" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/sivakumar026/dvcpipeline.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=sivakumar026" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=$DAGSHUB_TOKEN" >> $GITHUB_ENV

      - name: Run DVC pipeline
        run: dvc repro

      - name: Register model (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python src/models/model_reg.py

      - name: Commit dvc.lock changes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git add dvc.lock
          git diff --staged --quiet || git commit -m "Auto-update dvc.lock [skip ci]"
          git push
