stages:
  data_collection:
    cmd: python src/data/data_collection.py
    deps:
    - data/external/loan_data.csv
    - params.yaml
    - src/data/data_collection.py
    params:
    - data_collection.test_size_param
    - data_collection.random_state_param
    outs:
    - data/raw/test.csv
    - data/raw/train.csv

  data_prep:
    cmd: python src/data/data_prep.py
    deps:
    - data/raw/test.csv
    - data/raw/train.csv
    - src/data/data_prep.py
    outs:
    - data/processed/test_processed.csv
    - data/processed/train_processed.csv

  model_building:
    cmd: python src/models/model_build.py       # ✅ was model_building.py
    deps:
    - data/processed/train_processed.csv
    - src/models/model_build.py                 # ✅ was model_building.py
    outs:
    - models/model.pkl

  model_evaluation:
    cmd: python src/models/model_eval.py        # ✅ check this too
    deps:
    - data/processed/test_processed.csv
    - models/model.pkl
    - src/models/model_eval.py                  # ✅ check this too
    outs:
    - reports/metrics.json